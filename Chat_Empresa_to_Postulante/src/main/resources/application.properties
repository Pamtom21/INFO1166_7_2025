# ================================
# Nombre de la aplicación
# ================================
spring.application.name=Chat_Empresa_to_Postulante

# ================================
# Configuración de PostgreSQL
# ================================
spring.datasource.url=jdbc:postgresql://dpg-d2r90595pdvs7390nke0-a.oregon-postgres.render.com:5432/chat_bne
spring.datasource.username=chat_bne_user
spring.datasource.password=waeGmc192aeDM5jwzS7oP2r5Lxy5hAaU
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# Hibernate / JPA
# ================================
spring.jpa.hibernate.ddl-auto=update           # Actualiza automáticamente las tablas según las entidades
spring.jpa.show-sql=true                        # Muestra las consultas SQL en consola
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true # Formatea el SQL para mejor lectura

# ================================
# Pool de conexiones HikariCP
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# Swagger / OpenAPI
# ================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ================================
# Seguridad
# ================================
spring.security.enabled=false     # Deshabilitado temporalmente, JWT después

# ================================
# Métricas (Micrometer + Prometheus)
# ================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# ================================
# Configuración adicional opcional
# ================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false  # Mejor manejo de fechas
spring.jackson.time-zone=UTC                                   # Ajuste de zona horaria

# ================================
# Mensajes / Logs
# ================================
logging.level.org.springframework=INFO
logging.level.com.domain=DEBUG   # Muestra logs de tu dominio y servicios
