<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNE Chat - Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.2/dist/css/bootstrap.min.css}" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    
    <!-- WebSocket Libraries -->
    <script th:src="@{/webjars/sockjs-client/1.5.1/dist/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
</head>
<body>
    <!-- Navigation -->
    <div th:replace="fragments/nav :: nav"></div>
    
    <!-- Main Content -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="fragments/sidebar :: sidebar"></div>
            
            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div th:replace="chat/components/conversation-list :: conversation-list"></div>
                <div th:replace="chat/components/chat-window :: chat-window"></div>
            </main>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.2/dist/js/bootstrap.bundle.min.js}"></script>
    
    <!-- jQuery -->
    <script th:src="@{/webjars/jquery/3.7.1/dist/jquery.min.js}"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/chat.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
