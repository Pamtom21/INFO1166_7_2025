# ==================== CONFIGURACIÓN BÁSICA ====================
# Nombre de la app
spring.application.name=Chat_Empresa_to_Postulante

# ==================== CONFIGURACIÓN DE POSTGRESQL ====================
# Configuración de PostgreSQL (Render.com)
spring.datasource.url=jdbc:postgresql://dpg-d2r90595pdvs7390nke0-a.oregon-postgres.render.com:5432/chat_bne?ssl=true&sslmode=require
spring.datasource.username=chat_bne_user
spring.datasource.password=waeGmc192aeDM5jwzS7oP2r5Lxy5hAaU
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== CONFIGURACIÓN HIBERNATE/JPA ====================
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ==================== POOL DE CONEXIONES HIKARICP ====================
# Pool de conexiones con HikariCP (optimizado)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=ChatBNEPool

# ==================== CONFIGURACIÓN THYMELEAF ====================
# Thymeleaf (para las plantillas HTML del login)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html

# ==================== CONFIGURACIÓN SERVIDOR ====================
# Servidor
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=always
server.compression.enabled=true

# ==================== SEGURIDAD ====================
# Spring Security (activado para el login)
spring.security.enabled=true

# Configuración de sesiones
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=always

# ==================== VALIDACIÓN ====================
# Validación de formularios
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ==================== SWAGGER/OPENAPI ====================
# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==================== MÉTRICAS Y MONITOREO ====================
# Métricas (Micrometer + Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.web.server.request.autotime.enabled=true

# ==================== LOGGING ====================
# Logging para debugging
logging.level.com.info1166=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# ==================== CONFIGURACIÓN ADICIONAL ====================
# Internacionalización
spring.web.locale=es
spring.web.locale-resolver=fixed

# Configuración de archivos estáticos
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
spring.mvc.static-path-pattern=/static/**

# Configuración de multipart (para futuras subidas de archivos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB